<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typografica — Page Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --panel:#111;--panel2:#1a1a1a;--panel3:#222;--panel4:#2a2a2a;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --gold:#b8975a;--gold2:#d4b47a;
  --text:#e8e4dc;--text2:#9a9285;--text3:#666;
  --accent:#b8975a;
  --sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden;font-family:var(--sans)}
body{display:flex;flex-direction:column;background:var(--panel);color:var(--text)}

/* TOP BAR */
.topbar{
  height:52px;background:var(--panel2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;flex-shrink:0;z-index:100;
}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;letter-spacing:0.1em;color:var(--text)}
.topbar-logo span{color:var(--gold)}
.topbar-center{display:flex;gap:4px}
.tab-btn{
  padding:6px 16px;border:none;background:transparent;color:var(--text2);
  font-family:var(--sans);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;border-radius:4px;transition:all 0.2s;
}
.tab-btn.active{background:rgba(184,151,90,0.15);color:var(--gold)}
.tab-btn:hover:not(.active){background:var(--panel3);color:var(--text)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn-preview,.btn-export{
  padding:7px 18px;font-family:var(--sans);font-size:11px;
  letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;
  border-radius:3px;transition:all 0.2s;
}
.btn-preview{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-preview:hover{border-color:var(--gold);color:var(--gold)}
.btn-export{background:var(--gold);border:1px solid var(--gold);color:#0d0c0a;font-weight:500}
.btn-export:hover{background:var(--gold2)}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:300px;min-width:300px;background:var(--panel2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-search{
  padding:12px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-search input{
  width:100%;background:var(--panel3);border:1px solid var(--border);
  color:var(--text);font-family:var(--sans);font-size:12px;
  padding:8px 12px;border-radius:4px;outline:none;
}
.sidebar-search input::placeholder{color:var(--text3)}
.sidebar-search input:focus{border-color:rgba(184,151,90,0.4)}
.sections-list{flex:1;overflow-y:auto;padding:8px}
.sections-list::-webkit-scrollbar{width:4px}
.sections-list::-webkit-scrollbar-track{background:transparent}
.sections-list::-webkit-scrollbar-thumb{background:var(--panel4);border-radius:2px}

/* SECTION ACCORDION */
.section-group{margin-bottom:4px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.section-header{
  padding:10px 14px;background:var(--panel3);
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;transition:background 0.2s;
}
.section-header:hover{background:var(--panel4)}
.section-header.active{background:rgba(184,151,90,0.1);border-bottom:1px solid rgba(184,151,90,0.2)}
.section-header-left{display:flex;align-items:center;gap:8px}
.section-icon{font-size:14px;opacity:0.6}
.section-name{font-size:12px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--text)}
.section-badge{
  font-size:9px;padding:2px 6px;border-radius:10px;
  background:rgba(184,151,90,0.2);color:var(--gold);
  font-family:var(--mono);letter-spacing:0.05em;
}
.section-chevron{font-size:10px;color:var(--text3);transition:transform 0.2s}
.section-chevron.open{transform:rotate(180deg)}
.section-body{display:none;padding:12px;background:var(--panel2)}
.section-body.open{display:block}

/* FIELDS */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{
  display:block;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--text2);margin-bottom:6px;
}
.field input[type=text],
.field input[type=url],
.field textarea,
.field select{
  width:100%;background:var(--panel3);border:1px solid var(--border);
  color:var(--text);font-family:var(--sans);font-size:12px;
  padding:8px 10px;border-radius:4px;outline:none;
  transition:border-color 0.2s;resize:vertical;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(184,151,90,0.5)}
.field textarea{min-height:60px;font-size:12px}
.field select option{background:var(--panel3)}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-row .field{margin-bottom:0}

/* COLOR PICKER */
.color-row{display:flex;align-items:center;gap:8px}
.color-swatch{
  width:30px;height:30px;border-radius:4px;border:1px solid var(--border2);
  cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;
}
.color-swatch input[type=color]{
  position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);
  opacity:0;cursor:pointer;border:none;padding:0;
}
.color-value{
  flex:1;background:var(--panel3);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:11px;
  padding:7px 10px;border-radius:4px;outline:none;
}

/* RANGE */
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{
  flex:1;-webkit-appearance:none;height:3px;
  background:var(--panel4);border-radius:2px;outline:none;
}
.range-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  background:var(--gold);border-radius:50%;cursor:pointer;
}
.range-val{font-size:11px;font-family:var(--mono);color:var(--gold);min-width:32px;text-align:right}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle{
  width:36px;height:20px;background:var(--panel4);border-radius:10px;
  cursor:pointer;position:relative;transition:background 0.2s;border:1px solid var(--border2);
}
.toggle.on{background:rgba(184,151,90,0.4);border-color:rgba(184,151,90,0.5)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:14px;height:14px;background:var(--text2);border-radius:50%;
  transition:all 0.2s;
}
.toggle.on::after{left:18px;background:var(--gold)}

/* DIVIDER */
.field-divider{height:1px;background:var(--border);margin:12px 0}

/* CANVAS AREA */
.canvas-wrap{
  flex:1;overflow:hidden;display:flex;flex-direction:column;
  background:#0a0908;position:relative;
}
.canvas-toolbar{
  height:40px;background:var(--panel2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0;
}
.viewport-btn{
  padding:4px 10px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
  background:transparent;border:1px solid var(--border);color:var(--text2);
  cursor:pointer;border-radius:3px;font-family:var(--sans);transition:all 0.2s;
}
.viewport-btn.active{background:rgba(184,151,90,0.15);border-color:rgba(184,151,90,0.3);color:var(--gold)}
.canvas-info{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--text3)}
.canvas-scroll{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.canvas-scroll::-webkit-scrollbar{width:6px;height:6px}
.canvas-scroll::-webkit-scrollbar-track{background:#0a0908}
.canvas-scroll::-webkit-scrollbar-thumb{background:var(--panel4);border-radius:3px}
.canvas-frame{
  background:#0d0c0a;transition:width 0.3s ease;
  box-shadow:0 0 0 1px rgba(184,151,90,0.1),0 20px 60px rgba(0,0,0,0.6);
  transform-origin:top center;
}

/* PANEL PROPERTIES (right) */
.props-panel{
  width:260px;min-width:260px;background:var(--panel2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.props-header{
  padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.props-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text2)}
.props-body{flex:1;overflow-y:auto;padding:12px}
.props-body::-webkit-scrollbar{width:4px}
.props-body::-webkit-scrollbar-thumb{background:var(--panel4)}
.prop-section{margin-bottom:16px}
.prop-section-title{
  font-size:9px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.color-chip{
  width:32px;height:32px;border-radius:4px;cursor:pointer;
  border:2px solid transparent;transition:all 0.15s;
}
.color-chip:hover{transform:scale(1.1)}
.color-chip.selected{border-color:var(--gold)}
.font-options{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.font-opt{
  padding:8px 12px;border-radius:4px;border:1px solid var(--border);
  cursor:pointer;transition:all 0.2s;font-size:13px;color:var(--text2);
}
.font-opt:hover{border-color:var(--border2);color:var(--text)}
.font-opt.selected{border-color:rgba(184,151,90,0.5);background:rgba(184,151,90,0.08);color:var(--gold)}

/* STATUS BAR */
.statusbar{
  height:24px;background:var(--panel);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:20px;flex-shrink:0;
}
.status-item{font-size:10px;font-family:var(--mono);color:var(--text3)}
.status-dot{width:6px;height:6px;background:#4caf50;border-radius:50%;display:inline-block;margin-right:5px}

/* NOTIFICATION */
.notif{
  position:fixed;bottom:32px;right:24px;
  background:var(--panel2);border:1px solid rgba(184,151,90,0.3);
  color:var(--gold);font-size:12px;letter-spacing:0.05em;
  padding:10px 20px;border-radius:4px;
  transform:translateY(20px);opacity:0;
  transition:all 0.3s ease;pointer-events:none;z-index:999;
}
.notif.show{transform:translateY(0);opacity:1}

/* HIGHLIGHT on canvas click */
.pb-highlight{outline:2px solid rgba(184,151,90,0.6)!important;outline-offset:2px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">Typogra<span>f</span>ica <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:8px">Page Builder</span></div>
  <div class="topbar-center">
    <button class="tab-btn active" onclick="setTab('design',this)">Design</button>
    <button class="tab-btn" onclick="setTab('content',this)">Contenuto</button>
    <button class="tab-btn" onclick="setTab('global',this)">Globale</button>
  </div>
  <div class="topbar-actions">
    <button class="btn-preview" onclick="openPreview()">↗ Anteprima</button>
    <button class="btn-export" onclick="exportCode()">⬇ Esporta HTML</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <input type="text" placeholder="Cerca sezione o campo..." id="searchInput" oninput="filterSections(this.value)">
    </div>
    <div class="sections-list" id="sectionsList"></div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap">
    <div class="canvas-toolbar">
      <button class="viewport-btn active" onclick="setViewport('desktop',this)">Desktop</button>
      <button class="viewport-btn" onclick="setViewport('tablet',this)">Tablet</button>
      <button class="viewport-btn" onclick="setViewport('mobile',this)">Mobile</button>
      <span class="canvas-info" id="canvasInfo">1280px</span>
    </div>
    <div class="canvas-scroll">
      <div class="canvas-frame" id="canvasFrame">
        <iframe id="previewFrame" style="width:100%;border:none;display:block" scrolling="yes"></iframe>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="props-panel">
    <div class="props-header">
      <span class="props-title">Stili Globali</span>
    </div>
    <div class="props-body">
      <div class="prop-section">
        <div class="prop-section-title">Colori principali</div>
        <div class="color-grid" id="colorGrid"></div>
      </div>
      <div class="prop-section">
        <div class="prop-section-title">Font titoli</div>
        <div class="font-options" id="fontOptions"></div>
      </div>
      <div class="prop-section">
        <div class="prop-section-title">Accento</div>
        <div class="field">
          <label class="field-label">Colore oro / accento</label>
          <div class="color-row">
            <div class="color-swatch" id="accentSwatch" style="background:#b8975a">
              <input type="color" value="#b8975a" oninput="updateAccent(this.value)">
            </div>
            <input class="color-value" type="text" value="#b8975a" id="accentVal" oninput="updateAccentText(this.value)">
          </div>
        </div>
      </div>
      <div class="prop-section">
        <div class="prop-section-title">Animazioni</div>
        <div class="toggle-row field">
          <span class="field-label" style="margin:0">Scroll reveal</span>
          <div class="toggle on" id="toggleReveal" onclick="toggleReveal(this)"></div>
        </div>
        <div class="toggle-row field">
          <span class="field-label" style="margin:0">Cursore custom</span>
          <div class="toggle on" id="toggleCursor" onclick="toggleCursor(this)"></div>
        </div>
        <div class="toggle-row field">
          <span class="field-label" style="margin:0">Marquee animato</span>
          <div class="toggle on" id="toggleMarquee" onclick="toggleMarqueeAnim(this)"></div>
        </div>
      </div>
      <div class="prop-section">
        <div class="prop-section-title">Spaziatura sezioni</div>
        <div class="field">
          <label class="field-label">Padding verticale</label>
          <div class="range-row">
            <input type="range" min="60" max="200" value="140" oninput="updateSpacing(this.value);this.nextElementSibling.textContent=this.value+'px'">
            <span class="range-val">140px</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <span class="status-item"><span class="status-dot"></span>Live</span>
  <span class="status-item" id="statusSection">Nessuna sezione selezionata</span>
  <span class="status-item" id="statusTime"></span>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif"></div>

// ═══════════════════════════════════════════
// GET / SET nested state value
// ═══════════════════════════════════════════
function getVal(sectionId, keyPath){
  const sec = state.sections[sectionId];
  const parts = keyPath.split('.');
  let cur = sec;
  for(const p of parts){
    if(cur===undefined||cur===null) return '';
    if(Array.isArray(cur)) cur = cur[parseInt(p)];
    else cur = cur[p];
  }
  return cur ?? '';
}
function setVal(sectionId, keyPath, value){
  const sec = state.sections[sectionId];
  const parts = keyPath.split('.');
  let cur = sec;
  for(let i=0;i<parts.length-1;i++){
    const p = parts[i];
    if(Array.isArray(cur)) cur = cur[parseInt(p)];
    else cur = cur[p];
  }
  const last = parts[parts.length-1];
  if(Array.isArray(cur)) cur[parseInt(last)] = value;
  else cur[last] = value;
}

// ═══════════════════════════════════════════
// BUILD SIDEBAR
// ═══════════════════════════════════════════
function buildSidebar(){
  const list = document.getElementById('sectionsList');
  list.innerHTML = '';
  sectionDefs.forEach(def => {
    const group = document.createElement('div');
    group.className = 'section-group';
    group.dataset.sectionId = def.id;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <div class="section-header-left">
        <span class="section-icon">${def.icon}</span>
        <span class="section-name">${def.name}</span>
        <span class="section-badge">${def.badge}</span>
      </div>
      <span class="section-chevron" id="chev-${def.id}">▼</span>
    `;
    header.onclick = () => toggleSection(def.id);

    const body = document.createElement('div');
    body.className = 'section-body';
    body.id = `body-${def.id}`;

    def.fields.forEach(f => {
      if(f.type === 'divider'){
        const d = document.createElement('div');
        d.className = 'field-divider';
        body.appendChild(d);
        return;
      }
      const field = document.createElement('div');
      field.className = 'field';
      const currentVal = getVal(def.id, f.key);

      if(f.type === 'text'){
        field.innerHTML = `<label class="field-label">${f.label}</label>
          <input type="text" value="${escHtml(String(currentVal))}"
            oninput="updateField('${def.id}','${f.key}',this.value)">`;
      } else if(f.type === 'textarea'){
        field.innerHTML = `<label class="field-label">${f.label}</label>
          <textarea oninput="updateField('${def.id}','${f.key}',this.value)">${escHtml(String(currentVal))}</textarea>`;
      } else if(f.type === 'url'){
        field.innerHTML = `<label class="field-label">${f.label}</label>
          <input type="url" value="${escHtml(String(currentVal))}" placeholder="https://"
            oninput="updateField('${def.id}','${f.key}',this.value)">`;
      } else if(f.type === 'color'){
        field.innerHTML = `<label class="field-label">${f.label}</label>
          <div class="color-row">
            <div class="color-swatch" style="background:${currentVal}">
              <input type="color" value="${currentVal}"
                oninput="updateFieldColor('${def.id}','${f.key}',this)">
            </div>
            <input class="color-value" type="text" value="${currentVal}"
              oninput="updateField('${def.id}','${f.key}',this.value)">
          </div>`;
      }
      body.appendChild(field);
    });

    group.appendChild(header);
    group.appendChild(body);
    list.appendChild(group);
  });
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleSection(id){
  const body = document.getElementById(`body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  const header = body.previousElementSibling;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
  header.classList.toggle('active', !isOpen);
  if(!isOpen) document.getElementById('statusSection').textContent = `Modifica: ${sectionDefs.find(d=>d.id===id).name}`;
}

function filterSections(query){
  const q = query.toLowerCase();
  document.querySelectorAll('.section-group').forEach(g => {
    const name = g.querySelector('.section-name').textContent.toLowerCase();
    const fields = [...g.querySelectorAll('.field-label')].map(l=>l.textContent.toLowerCase()).join(' ');
    g.style.display = (name.includes(q)||fields.includes(q)||q==='') ? '' : 'none';
  });
}

// UPDATE FIELD
// ═══════════════════════════════════════════
function updateField(sectionId, key, value){
  setVal(sectionId, key, value);
  renderPreview();
}
function updateFieldColor(sectionId, key, input){
  setVal(sectionId, key, input.value);
  input.closest('.color-swatch').style.background = input.value;
  input.closest('.color-row').querySelector('.color-value').value = input.value;
  renderPreview();
}

function updateAccentText(val){
  if(/^#[0-9a-fA-F]{6}$/.test(val)){
    state.accent = val;
    document.getElementById('accentSwatch').style.background = val;
    document.getElementById('accentSwatch').querySelector('input').value = val;
    renderPreview();
  }
}
function updateSpacing(val){
  state.sectionPadding = parseInt(val);
  renderPreview();
}
function toggleReveal(el){
  el.classList.toggle('on');

  renderPreview();
}
function toggleCursor(el){
  el.classList.toggle('on');
  state.customCursor = el.classList.contains('on');
  renderPreview();
}
function toggleMarqueeAnim(el){
  el.classList.toggle('on');
  state.marqueeAnim = el.classList.contains('on');
  renderPreview();
}

  document.querySelectorAll('.viewport-btn').forEach(b=>b.classList.remove('active'));

  const w = viewports[name];
  document.getElementById('canvasInfo').textContent = w+'px';
  const frame = document.getElementById('canvasFrame');
  const iframe = document.getElementById('previewFrame');
  frame.style.width = w+'px';
  iframe.style.width = w+'px';

  else{iframe.style.height='';}
  notify('Viewport: '+name+' ('+w+'px)');
}

// ═══════════════════════════════════════════
// RENDER PREVIEW
// ═══════════════════════════════════════════
let renderTimer = null;
function renderPreview(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(_doRender, 80);
}

function _doRender(){
  const html = buildHTML();
  const iframe = document.getElementById('previewFrame');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  const scrollY = iframe.contentWindow ? iframe.contentWindow.scrollY : 0;
  doc.open();
  doc.write(html);
  doc.close();
  // Restore scroll
  if(scrollY) setTimeout(()=>{ try{iframe.contentWindow.scrollTo(0,scrollY);}catch(e){} }, 50);
  // Auto height
  setTimeout(()=>{
    try{
      const h = doc.documentElement.scrollHeight;
      iframe.style.height = h + 'px';
    }catch(e){}
  }, 200);
  document.getElementById('statusTime').textContent = 'Aggiornato: '+new Date().toLocaleTimeString('it-IT');
}

.section-tag::before{content:'';width:28px;height:1px;background:var(--gold)}
.section-title{font-family:var(--serif);font-size:clamp(40px,4vw,64px);font-weight:300;line-height:1.1}
.section-title em{font-style:italic;color:var(--gold-light)}
.section-link{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);text-decoration:none;margin-bottom:8px;display:flex;align-items:center;gap:8px;transition:gap 0.3s}
.section-link:hover{gap:16px}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(${hexToRgb(accent)},0.12)}
.service-card{background:var(--ink);padding:52px 44px;transition:background 0.4s;position:relative;overflow:hidden;cursor:${cursor}}
.service-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.4s}
.service-card:hover{background:var(--ink-2)}
.service-card:hover::before{transform:scaleX(1)}
.service-num{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:32px;display:block;opacity:0.6}
.service-name{font-family:var(--serif);font-size:28px;font-weight:300;line-height:1.2;margin-bottom:16px}
.service-desc{font-size:13px;line-height:1.75;color:rgba(250,248,244,0.45);font-weight:300;margin-bottom:32px}
.service-tag-list{display:flex;flex-wrap:wrap;gap:8px}
.service-tag{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;padding:5px 12px;border:1px solid rgba(${hexToRgb(accent)},0.2);color:rgba(250,248,244,0.4)}
.tesi-grid{display:grid;grid-template-columns:1fr 1fr;gap:100px;align-items:center}
.tesi-visual{position:relative;height:560px}
.tesi-book{position:absolute;width:260px;height:340px;box-shadow:-12px 12px 0 rgba(${hexToRgb(accent)},0.3),20px -8px 60px rgba(0,0,0,0.5)}
.tesi-book:nth-child(1){left:60px;top:60px;transform:rotate(-5deg);background:#2a2620;border:1px solid rgba(${hexToRgb(accent)},0.2);animation:bookFloat 4s ease-in-out infinite}
.tesi-book:nth-child(2){left:140px;top:100px;transform:rotate(2deg);background:#1f1e1b;border:1px solid rgba(${hexToRgb(accent)},0.15);animation:bookFloat 4s ease-in-out 0.8s infinite}
.tesi-book:nth-child(3){left:80px;top:80px;transform:rotate(-1deg);background:linear-gradient(135deg,var(--paper),var(--paper-2));animation:bookFloat 4s ease-in-out 1.6s infinite}
.book-spine{position:absolute;left:0;top:0;bottom:0;width:22px;background:rgba(0,0,0,0.15)}
.book-title-preview{position:absolute;left:36px;top:40px;right:20px}
.book-title-preview h4{font-family:var(--serif);font-size:16px;font-weight:300;color:#0d0c0a;line-height:1.4;margin-bottom:8px}
.book-title-preview p{font-size:10px;color:rgba(13,12,10,0.5);letter-spacing:0.1em}
.tesi-badge{position:absolute;right:30px;bottom:80px;background:var(--gold);color:var(--ink);padding:20px 24px;text-align:center;animation:badgePulse 3s ease-in-out infinite}
.tesi-badge span{display:block;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500}
.tesi-badge strong{display:block;font-family:var(--serif);font-size:28px;font-weight:300;margin-top:4px}
.tesi-features{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:48px}
.tesi-feature{padding:24px;border:1px solid rgba(${hexToRgb(accent)},0.12);transition:border-color 0.3s}
.tesi-feature:hover{border-color:rgba(${hexToRgb(accent)},0.4)}
.tesi-feature-icon{color:var(--gold);font-size:20px;margin-bottom:12px;display:block}
.tesi-feature-name{font-size:13px;font-weight:500;margin-bottom:6px}
.tesi-feature-desc{font-size:12px;color:rgba(250,248,244,0.4);line-height:1.6}
.process-steps{margin-top:80px;position:relative}
.process-line{position:absolute;top:28px;left:0;right:0;height:1px;background:rgba(${hexToRgb(accent)},0.15)}
.process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:60px;position:relative;z-index:1}
.step-num-wrap{display:flex;align-items:center;margin-bottom:32px}
.step-num{width:56px;height:56px;border:1px solid rgba(${hexToRgb(accent)},0.3);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:300;color:var(--gold);background:var(--ink);position:relative;z-index:1;transition:background 0.3s,border-color 0.3s}
.process-step:hover .step-num{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.step-title{font-family:var(--serif);font-size:22px;font-weight:300;margin-bottom:12px}
.step-desc{font-size:13px;color:rgba(250,248,244,0.4);line-height:1.7;font-weight:300}
.quote-banner{padding:120px 60px;background:var(--gold);text-align:center;position:relative;overflow:hidden}
.quote-banner::before{content:'"';position:absolute;font-family:var(--serif);font-size:400px;font-weight:300;color:rgba(13,12,10,0.06);line-height:1;top:-60px;left:40px;pointer-events:none}
.quote-text{font-family:var(--serif);font-size:clamp(28px,4vw,52px);font-weight:300;line-height:1.3;color:var(--ink);max-width:860px;margin:0 auto 32px;position:relative;z-index:1}
.quote-text em{font-style:italic}
.quote-author{font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(13,12,10,0.5);position:relative;z-index:1}
.materials-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:80px}
.material-card{aspect-ratio:3/4;position:relative;overflow:hidden;cursor:${cursor};transition:transform 0.4s}
.material-card:hover{transform:translateY(-8px)}
.material-bg{position:absolute;inset:0;transition:transform 0.5s}
.material-card:hover .material-bg{transform:scale(1.05)}
.mat1{background:linear-gradient(145deg,#1a1814 0%,#2d2a24 50%,#1a1814 100%)}
.mat2{background:linear-gradient(145deg,#0f1a15 0%,#1a2d22 50%,#0f1a15 100%)}
.mat3{background:linear-gradient(145deg,#1a1218 0%,#2d1f2a 50%,#1a1218 100%)}
.mat4{background:linear-gradient(145deg,#141218 0%,#22202d 50%,#141218 100%)}
.material-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,12,10,0.9) 0%,transparent 60%)}
.material-content{position:absolute;bottom:0;left:0;right:0;padding:28px 24px}
.material-name{font-family:var(--serif);font-size:20px;font-weight:300;margin-bottom:6px}
.material-desc{font-size:11px;color:rgba(250,248,244,0.45);letter-spacing:0.05em;line-height:1.5}
.mat-dot{position:absolute;top:20px;right:20px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(${hexToRgb(accent)},0.5)}
.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:100px;align-items:start}
.form-row{margin-bottom:24px}
.form-label{display:block;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(250,248,244,0.4);margin-bottom:10px}
.form-input,.form-select,.form-textarea{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(${hexToRgb(accent)},0.2);color:var(--white);font-family:var(--sans);font-size:14px;font-weight:300;padding:12px 0;outline:none;transition:border-color 0.3s;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--gold)}
.form-input::placeholder,.form-textarea::placeholder{color:rgba(250,248,244,0.2)}
.form-select option{background:#1a1916;color:var(--white)}
.form-textarea{resize:none;height:100px}
.form-fg{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.form-submit{display:inline-flex;align-items:center;gap:12px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:var(--sans);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;padding:16px 36px;cursor:${cursor};margin-top:16px;transition:all 0.3s}
.form-submit:hover{background:var(--gold);color:var(--ink)}
.info-items{margin-top:52px}
.info-item{display:flex;gap:20px;padding:24px 0;border-bottom:1px solid rgba(${hexToRgb(accent)},0.1)}
.info-icon{width:40px;height:40px;border:1px solid rgba(${hexToRgb(accent)},0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);font-size:16px}
.info-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(250,248,244,0.35);margin-bottom:4px}
.info-value{font-size:14px;color:rgba(250,248,244,0.8)}
footer{padding:60px 60px 40px;background:var(--ink-2);border-top:1px solid rgba(${hexToRgb(accent)},0.1)}
.footer-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:60px}
.footer-logo{font-family:var(--serif);font-size:32px;font-weight:300;letter-spacing:0.08em}
.footer-logo span{color:var(--gold)}
.footer-tagline{font-size:12px;color:rgba(250,248,244,0.3);margin-top:8px;letter-spacing:0.05em}
.footer-links{display:grid;grid-template-columns:repeat(3,1fr);gap:60px}
.footer-links h5{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;font-weight:400}
.footer-links ul{list-style:none}
.footer-links li{margin-bottom:10px}
.footer-links a{font-size:13px;color:rgba(250,248,244,0.4);text-decoration:none;transition:color 0.3s}
.footer-links a:hover{color:var(--white)}
.footer-bottom{border-top:1px solid rgba(${hexToRgb(accent)},0.1);padding-top:28px;display:flex;justify-content:space-between;align-items:center}
.footer-copy{font-size:11px;color:rgba(250,248,244,0.2);letter-spacing:0.05em}
.footer-made{font-size:11px;color:rgba(250,248,244,0.2);font-family:var(--mono)}
${state.scrollReveal ? `
.reveal{opacity:0;transform:translateY(32px);transition:opacity 0.8s ease,transform 0.8s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.rv1{transition-delay:0.1s}.rv2{transition-delay:0.2s}.rv3{transition-delay:0.3s}
` : ''}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes marqueeScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes scrollAnim{0%{top:-100%}100%{top:100%}}
@keyframes bookFloat{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-8px)}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 rgba(${hexToRgb(accent)},0.3)}50%{box-shadow:0 8px 30px rgba(${hexToRgb(accent)},0.3)}}
</style>
</head>
<body>
${state.customCursor ? '<div class="cursor" id="cursor"></div><div class="cursor-ring" id="cursorRing"></div>' : ''}

<!-- NAV -->
<nav id="navbar">
  <a href="#" class="nav-logo">${s.nav.logo.replace(s.nav.logoAccentLetter, `<span>${s.nav.logoAccentLetter}</span>`)}</a>
  <ul class="nav-links">
    ${s.nav.links.map((l,i)=>`<li><a href="#sec${i+1}">${l}</a></li>`).join('')}
  </ul>
  <a href="#contatti" class="nav-cta">${s.nav.ctaText}</a>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-lines"></div>
  <div class="hero-left">
    <p class="hero-tag">${s.hero.tag}</p>
    <h1 class="hero-title">${s.hero.titleLine1}<br><em>${s.hero.titleLine2}</em></h1>
    <p class="hero-subtitle">${s.hero.subtitle}</p>
    <div class="hero-actions">
      <a href="#servizi" class="btn-primary">${s.hero.btn1} <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M7 1l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a href="#tesi" class="btn-secondary">${s.hero.btn2}</a>
    </div>
  </div>
  <div class="hero-right">
    <div class="hero-visual">
      <svg viewBox="0 0 600 700" style="width:100%;height:100%" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(${hexToRgb(accent)},0.06)" stroke-width="0.5"/></pattern></defs>
        <rect width="600" height="700" fill="url(#grid)"/>
        <text x="60" y="180" font-family="Georgia,serif" font-size="140" font-weight="300" fill="rgba(${hexToRgb(accent)},0.12)">T</text>
        <rect x="80" y="200" width="280" height="360" rx="2" fill="#1a1814" stroke="rgba(${hexToRgb(accent)},0.2)" stroke-width="0.5"/>
        <rect x="80" y="200" width="280" height="28" rx="2" fill="${accent}" opacity="0.7"/>
        <text x="100" y="219" font-family="Georgia,serif" font-size="11" fill="#0d0c0a" letter-spacing="2">TYPOGRAFICA</text>
        <g stroke="rgba(250,248,244,0.08)" stroke-width="0.5"><line x1="100" y1="250" x2="340" y2="250"/><line x1="100" y1="270" x2="320" y2="270"/><line x1="100" y1="290" x2="300" y2="290"/><line x1="100" y1="320" x2="340" y2="320"/><line x1="100" y1="340" x2="310" y2="340"/><line x1="100" y1="370" x2="340" y2="370"/><line x1="100" y1="390" x2="290" y2="390"/><line x1="100" y1="420" x2="340" y2="420"/><line x1="100" y1="440" x2="310" y2="440"/></g>
        <circle cx="460" cy="530" r="55" fill="none" stroke="rgba(${hexToRgb(accent)},0.4)" stroke-width="1"/>
        <circle cx="460" cy="530" r="48" fill="none" stroke="rgba(${hexToRgb(accent)},0.2)" stroke-width="0.5"/>
        <text x="460" y="524" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="rgba(${hexToRgb(accent)},0.7)" letter-spacing="2">DAL</text>
        <text x="460" y="543" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="300" fill="rgba(${hexToRgb(accent)},0.9)">1987</text>
      </svg>
    </div>
  </div>
  <div class="hero-stats">
    <div class="stat"><span class="stat-num">${s.hero.stat1Num}</span><span class="stat-label">${s.hero.stat1Label}</span></div>
    <div class="stat"><span class="stat-num">${s.hero.stat2Num}</span><span class="stat-label">${s.hero.stat2Label}</span></div>
    <div class="stat"><span class="stat-num">${s.hero.stat3Num}</span><span class="stat-label">${s.hero.stat3Label}</span></div>
  </div>
  <div class="hero-scroll"><div class="scroll-line"></div>Scorri</div>
</section>

<!-- MARQUEE -->
<div class="marquee-section">
  <div class="marquee-track">
    ${[...s.marquee.items,...s.marquee.items].map(i=>`<span class="marquee-item"><span class="marquee-dot"></span>${i}</span>`).join('')}
  </div>
</div>

<!-- SERVIZI -->
<section class="section-wrap dark" id="servizi">
  <div class="section-header-row">
    <div>
      <p class="section-tag ${state.scrollReveal?'reveal':''}">${s.servizi.tag}</p>
      <h2 class="section-title ${state.scrollReveal?'reveal rv1':''}">${s.servizi.title}<br><em>${s.servizi.titleItalic}</em></h2>
    </div>
    <a href="#contatti" class="section-link ${state.scrollReveal?'reveal':''}">Tutti i servizi →</a>
  </div>
  <div class="services-grid">
    ${s.servizi.cards.map((c,i)=>`
    <div class="service-card ${state.scrollReveal?'reveal':''}">
      <span class="service-num">${c.num}</span>
      <h3 class="service-name">${c.name}</h3>
      <p class="service-desc">${c.desc}</p>
      <div class="service-tag-list">${c.tags.map(t=>`<span class="service-tag">${t}</span>`).join('')}</div>
    </div>`).join('')}
  </div>
</section>

<!-- TESI -->
<section class="section-wrap dark2" id="tesi">
  <div class="tesi-grid">
    <div>
      <p class="section-tag ${state.scrollReveal?'reveal':''}">${s.tesi.tag}</p>
      <h2 class="section-title ${state.scrollReveal?'reveal rv1':''}">${s.tesi.title}<br><em>${s.tesi.titleItalic}</em></h2>
      <p style="font-size:14px;line-height:1.75;color:rgba(250,248,244,0.55);margin-top:24px;font-weight:300" class="${state.scrollReveal?'reveal rv2':''}">${s.tesi.body}</p>
      <div class="tesi-features ${state.scrollReveal?'reveal rv3':''}">
        ${s.tesi.features.map(f=>`<div class="tesi-feature"><span class="tesi-feature-icon">${f.icon}</span><p class="tesi-feature-name">${f.name}</p><p class="tesi-feature-desc">${f.desc}</p></div>`).join('')}
      </div>
    </div>
    <div class="tesi-visual ${state.scrollReveal?'reveal rv2':''}">
      <div class="tesi-book"><div class="book-spine"></div></div>
      <div class="tesi-book"><div class="book-spine"></div></div>
      <div class="tesi-book">
        <div class="book-spine"></div>
        <div class="book-title-preview"><h4>Analisi dei sistemi tipografici nell'era digitale</h4><p>Politecnico di Torino — A.A. 2023/2024</p></div>
      </div>
      <div class="tesi-badge"><span>${s.tesi.badgeLabel}</span><strong>${s.tesi.badgeValue}</strong></div>
    </div>
  </div>
</section>

<!-- PROCESS -->
<section class="section-wrap dark" id="process">
  <div class="section-header-row">
    <div>
      <p class="section-tag ${state.scrollReveal?'reveal':''}">${s.process.tag}</p>
      <h2 class="section-title ${state.scrollReveal?'reveal rv1':''}">${s.process.title}<br><em>${s.process.titleItalic}</em></h2>
    </div>
  </div>
  <div class="process-steps">
    <div class="process-line"></div>
    <div class="process-grid">
      ${s.process.steps.map((st,i)=>`<div class="process-step ${state.scrollReveal?'reveal':''}"><div class="step-num-wrap"><div class="step-num">${st.num}</div></div><h4 class="step-title">${st.title}</h4><p class="step-desc">${st.desc}</p></div>`).join('')}
    </div>
  </div>
</section>

<!-- QUOTE -->
<div class="quote-banner ${state.scrollReveal?'reveal':''}">
  <p class="quote-text">${s.quote.text.replace(s.quote.italicWords,`<em>${s.quote.italicWords}</em>`)}</p>
  <p class="quote-author">${s.quote.author}</p>
</div>

<!-- MATERIALI -->
<section class="section-wrap dark2" id="materiali">
  <div class="section-header-row">
    <div>
      <p class="section-tag ${state.scrollReveal?'reveal':''}">${s.materiali.tag}</p>
      <h2 class="section-title ${state.scrollReveal?'reveal rv1':''}">${s.materiali.title}<br><em>${s.materiali.titleItalic}</em></h2>
    </div>
  </div>
  <div class="materials-grid">
    ${s.materiali.cards.map((c,i)=>`<div class="material-card ${state.scrollReveal?'reveal':''}"><div class="material-bg mat${i+1}"></div><div class="material-overlay"></div><div class="mat-dot"></div><div class="material-content"><h4 class="material-name">${c.name}</h4><p class="material-desc">${c.desc}</p></div></div>`).join('')}
  </div>
</section>

<!-- CONTATTI -->
<section class="section-wrap dark" id="contatti">
  <div class="cta-grid">
    <div>
      <p class="section-tag ${state.scrollReveal?'reveal':''}">${s.contatti.tag}</p>
      <h2 class="section-title ${state.scrollReveal?'reveal rv1':''}">${s.contatti.title}<br><em>${s.contatti.titleItalic}</em></h2>
      <p style="font-size:14px;line-height:1.75;color:rgba(250,248,244,0.55);margin-top:24px;font-weight:300" class="${state.scrollReveal?'reveal rv2':''}">${s.contatti.body}</p>
      <div class="info-items ${state.scrollReveal?'reveal rv3':''}">
        <div class="info-item"><div class="info-icon">📍</div><div><p class="info-label">Indirizzo</p><p class="info-value">${s.contatti.address}</p></div></div>
        <div class="info-item"><div class="info-icon">📞</div><div><p class="info-label">Telefono</p><p class="info-value">${s.contatti.phone}</p></div></div>
        <div class="info-item"><div class="info-icon">✉</div><div><p class="info-label">Email</p><p class="info-value">${s.contatti.email}</p></div></div>
        <div class="info-item"><div class="info-icon">🕐</div><div><p class="info-label">Orari</p><p class="info-value">${s.contatti.hours}</p></div></div>
      </div>
    </div>
    <div class="${state.scrollReveal?'reveal rv2':''}">
      <div class="form-fg">
        <div class="form-row"><label class="form-label">Nome</label><input class="form-input" type="text" placeholder="Mario Rossi"></div>
        <div class="form-row"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="mario@email.it"></div>
      </div>
      <div class="form-row"><label class="form-label">Tipo di Servizio</label><select class="form-select"><option>Stampa Digitale</option><option>Stampa Tipografica</option><option>Tesi di Laurea</option><option>Gran Formato</option><option>Finiture Speciali</option></select></div>
      <div class="form-fg">
        <div class="form-row"><label class="form-label">Quantità</label><input class="form-input" type="text" placeholder="es. 500 copie"></div>

// ═══════════════════════════════════════════
// COLOR HELPERS
// ═══════════════════════════════════════════
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}
function lightenColor(hex, amount){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amount); g=Math.min(255,g+amount); b=Math.min(255,b+amount);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ═══════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════
function exportCode(){
  const html = buildHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'index.html'; a.click();
  URL.revokeObjectURL(url);
  notify('✓ index.html esportato!');
}

function openPreview(){
  const html = buildHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  window.open(url,'_blank');
  notify('Anteprima aperta in nuova scheda');
}

// ═══════════════════════════════════════════
// NOTIFICATION
// ═══════════════════════════════════════════
let notifTimer;
function notify(msg){
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}
